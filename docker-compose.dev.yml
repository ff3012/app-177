# Local development database only. Run `npm run dev` against this on the host.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ffapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ffapp}
    ports:
      - '5432:5432'
    volumes:
      - ffapp_dev_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ffapp_dev_pgdata:
