# Production stack. Run from anywhere with:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d --build
# (paths below are relative to this file, i.e. the repo root's parent of /docker)
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # The server OS runs in UTC. Termine/Flüge/News are always entered as Vienna wall-clock
      # time (matching the .ics export's Europe/Vienna timezone) - without this, `new Date()`
      # parsing a plain "YYYY-MM-DDTHH:mm" string in a Server Action would interpret it as UTC
      # instead, silently shifting every stored time by Vienna's UTC offset (1-2h depending on DST).
      TZ: Europe/Vienna
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      ABSCHNITTS_ICS_TOKEN: ${ABSCHNITTS_ICS_TOKEN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME:-BFKDO St. Pölten}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      CRON_SECRET: ${CRON_SECRET}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PHOTOS_BUCKET: ${S3_PHOTOS_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - '3000'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    # caddy_net: external network shared with the dev/staging stack (docker-compose.staging.yml),
    # so this Caddy instance can also reverse_proxy dev.app-177... to the dev stack's app container
    # (see docker/README.md "Zweiter Stack für eine Test-/Dev-Umgebung"). Applied live on the
    # server when the dev stack was set up (2026-08-13) but never committed until now - was the
    # one uncommitted local change blocking `git pull` on the production checkout.
    networks:
      - default
      - caddy_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    external: true
